[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adbcaller-agent"
version = "0.1.0"
description = "Agente local mínimo para ADB Caller SaaS"
requires-python = ">=3.11"
dependencies = [
    "adbcaller-core==0.1.0",
    "adbcaller-protocol==0.1.0",
    "websockets>=15,<17",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
adbcaller-agent = "adbcaller_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adbcaller_agent*"]
