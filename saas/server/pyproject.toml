[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adbcaller-server"
version = "0.1.0"
description = "Servidor multi-tenant de ADB Caller SaaS"
requires-python = ">=3.11"
dependencies = [
    "adbcaller-protocol==0.1.0",
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.30,<1",
    "websockets>=15,<17",
]

[project.scripts]
adbcaller-server = "adbcaller_server.main:run"
adbcaller-admin = "adbcaller_server.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adbcaller_server*"]

[tool.setuptools.package-data]
adbcaller_server = ["templates/*.html", "templates/**/*.html", "static/**/*"]
